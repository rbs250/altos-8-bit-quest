<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Altos QA — video atlas stepper</title>
  <link rel="stylesheet" href="./styles.css">
  <script>
    // Deterministic frame stepper: the preview pane keeps the page hidden, so
    // requestAnimationFrame never fires. Capture the pending callback and let
    // __step(n) advance the game by exactly n frames of fixed dt.
    (function () {
      var pending = null, vt = 0;
      window.requestAnimationFrame = function (cb) { pending = cb; return 1; };
      window.cancelAnimationFrame = function () { pending = null; };
      window.__step = function (n, dt) {
        n = n || 1; dt = dt || 1000 / 60;
        for (var i = 0; i < n; i++) {
          var cb = pending; pending = null; vt += dt;
          if (cb) cb(vt);
        }
        return vt;
      };
      window.__vt = function () { return vt; };
    })();
  </script>
</head>
<body>
  <main class="cabinet">
    <div class="screen">
      <canvas id="game" width="640" height="360" tabindex="0" aria-label="Altos 8-Bit Quest game"></canvas>
      <div class="scanlines"></div>
    </div>
    <div class="marquee">
      <span>ALTOS 8-BIT QUEST</span>
      <button id="restart" type="button">RESET</button>
    </div>
    <div class="touch-controls" aria-label="On-screen keyboard">
      <div class="touch-keyboard" aria-label="Arrow keys">
        <button class="touch-btn touch-dir touch-up" type="button" data-control="flap" aria-label="Fly upward">▲</button>
        <button class="touch-btn touch-dir touch-left" type="button" data-control="left" aria-label="Move left">◀</button>
        <button class="touch-btn touch-dir touch-down" type="button" data-control="down" aria-label="Drop down">▼</button>
        <button class="touch-btn touch-dir touch-right" type="button" data-control="right" aria-label="Move right">▶</button>
      </div>
      <div class="touch-actions" aria-label="Actions">
        <button class="touch-btn touch-start" type="button" data-control="start" aria-label="Start or select">START</button>
        <button class="touch-btn touch-action" type="button" data-control="fire" aria-label="Fire">FIRE</button>
      </div>
    </div>
  </main>
  <script>
    // Load the game scripts with a per-load cache-buster. With a fixed query
    // the browser happily serves a stale game.js, which then requests atlases
    // under an old ASSET_VERSION — that silently verified old art against new
    // frame counts (blank cells) until it was caught.
    (function () {
      var cb = 'qa' + Date.now() + Math.random().toString(36).slice(2);
      function load(src) {
        return new Promise(function (res, rej) {
          var s = document.createElement('script');
          s.src = src + '?v=' + cb;
          s.onload = res;
          s.onerror = rej;
          document.body.appendChild(s);
        });
      }
      window.__qaReady = load('./characters.js').then(function () {
        return load('./game.js');
      });
    })();
  </script>
</body>
</html>
